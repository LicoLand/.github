name: repository-release-governance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - $default-branch
    tags:
      - "v*.*.*"
      - "*-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  version-governance:
    uses: LicoLand/.github/.github/workflows/reusable-version-governance.yml@f9d2a1419e494610fd320504fbcad9b04e9eb614
    with:
      governance_ref: "f9d2a1419e494610fd320504fbcad9b04e9eb614"
      target_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      require_tag: ${{ github.ref_type == 'tag' }}

  general-auditor:
    name: General-Auditor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Run General-Auditor
        uses: Unka-Malloc/General-Auditor@only
        with:
          repository: ${{ github.repository }}
          directory: .
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          scope: history
