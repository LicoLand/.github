name: repository-release-governance

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - $default-branch
    tags:
      - "v*.*.*"
      - "*-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  version-governance:
    uses: LicoLand/.github/.github/workflows/reusable-version-governance.yml@1a2530f3614f3b4ca46b9bd89f020a1946d34e84
    with:
      governance_ref: "1a2530f3614f3b4ca46b9bd89f020a1946d34e84"
      target_repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      require_tag: ${{ github.ref_type == 'tag' }}

  lico-auditor:
    uses: LicoLand/Lico-Auditor/.github/workflows/release-audit.yml@only
