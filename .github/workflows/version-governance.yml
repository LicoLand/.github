name: version-governance

on:
  pull_request:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  version-governance:
    uses: ./.github/workflows/reusable-version-governance.yml
    with:
      governance_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      expected_repository: ${{ github.repository }}
      plan_path: docs/releases/plan.json
      tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      require_tag: ${{ github.ref_type == 'tag' }}
