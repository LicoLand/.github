name: licolite-audit-gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  licolite-audit-gate:
    name: licolite-audit-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: target

      - name: Checkout audit source of truth
        uses: actions/checkout@v5
        with:
          repository: LicoLite/licolite-audit
          ref: only
          fetch-depth: 0
          path: licolite-audit

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify audit source of truth
        run: |
          licolite-audit/bin/licolite-audit source-of-truth \
            --repo licolite-audit \
            --remote origin \
            --branch only \
            --require-current-head \
            --enforce-remote-heads

      - name: Run LicoLite audit gate
        run: |
          licolite-audit/bin/licolite-audit gate \
            --repo target \
            --history \
            --format text
