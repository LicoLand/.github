name: Version capability scenario
description: Propose one independently acceptable capability for a minor, major, initial, or stabilization release.
title: "[Scenario] "
labels:
  - "type:scenario"
  - "type:capability"
  - "scenario:planned"
body:
  - type: markdown
    attributes:
      value: |
        This issue must correspond to one scenario in `docs/releases/plan.json`.
        Do not include credentials, private endpoints, runtime data, local paths, or unredacted evidence.
  - type: input
    id: target-version
    attributes:
      label: Target version
      description: Use the stable version owned by the repository milestone.
      placeholder: "0.2.0"
    validations:
      required: true
  - type: dropdown
    id: classification
    attributes:
      label: Release classification
      options:
        - minor
        - major
        - initial
        - stabilization
    validations:
      required: true
  - type: input
    id: scenario-id
    attributes:
      label: Scenario ID
      placeholder: "SCN-001"
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: User-visible outcome
      description: State the independently useful capability, not its implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable conditions.
      placeholder: |
        - Given ..., when ..., then ...
        - The repository verifier ...
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Planned evidence
      description: Name the checks or public artifacts that will prove acceptance. Add links only after they exist.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: Risk
      options:
        - low
        - medium
        - high
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Contract confirmation
      options:
        - label: This issue has one owning repository and one target milestone.
          required: true
        - label: The matching repository plan will remain the acceptance authority.
          required: true
